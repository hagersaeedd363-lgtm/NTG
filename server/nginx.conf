# NGINX — serve the built Angular SPA with path-based routing fallback.
# Build with `npm run build:prod`, then point `root` at dist/ntg-clarity-networks.
server {
  listen 80;
  server_name _;
  root /var/www/ntg-clarity-networks;
  index index.html;

  # long-cache fingerprinted assets
  location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: any unknown path returns index.html so Angular routing resolves it
  location / {
    try_files $uri $uri/ /index.html;
  }

  # OPTIONAL backend proxies (uncomment + adjust when wiring REST APIs)
  # location /api/strapi/ { proxy_pass http://strapi:1337/api/; }
  # location /api/        { proxy_pass http://springboot:8080/api/; }
}
